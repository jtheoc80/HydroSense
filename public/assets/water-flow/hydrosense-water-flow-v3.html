<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HydroSense — How a smart shutoff saves your home (v3 dramatic)</title>
<style>
  body {
    margin: 0;
    background: #001A4E;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  svg { width: 100%; max-width: 1600px; height: auto; }

  /* ===========================================
     LOOP: 16 seconds total
     0.0–3.0s:  Water fills system (city main → device → house → branches → fixtures)
     3.0–4.5s:  Steady operation
     4.5–5.5s:  Crack appears, first drips
     5.5–7.5s:  BIG LEAK — streams gush, puddle grows, splashes
     7.5–8.5s:  Detection (amber, rings)
     8.5–9.5s:  Shutoff fires (red, valve closes, camera zoom)
     9.5–11.0s: Water drains, leak stops
     11.0–15.0s: Damage averted callout (puddle remains as evidence)
     15.0–16.0s: Reset for loop
     =========================================== */

  /* ===== CONTINUOUS WATER DASH FLOW ===== */
  @keyframes flow { to { stroke-dashoffset: -40; } }
  @keyframes flow-fast { to { stroke-dashoffset: -60; } }
  @keyframes water-breathe {
    0%, 100% { opacity: 0.9; }
    50%      { opacity: 1; }
  }

  .water-stream {
    stroke-dasharray: 14 8;
    animation: flow 1.6s linear infinite;
  }
  .water-stream-fast {
    stroke-dasharray: 18 6;
    animation: flow-fast 1.2s linear infinite;
  }

  /* ===== PIPE FILL: water draws in from one end, drains at shutoff ===== */
  /* All percentages over 16s loop */

  @keyframes fill-inlet {
    0%        { transform: scaleX(0); }
    3%        { transform: scaleX(1); }
    59%       { transform: scaleX(1); }
    63%       { transform: scaleX(0); transform-origin: 100% 50%; }
    100%      { transform: scaleX(0); transform-origin: 100% 50%; }
  }
  .fill-inlet { transform-origin: 0% 50%; transform-box: fill-box; animation: fill-inlet 16s linear infinite; }

  @keyframes fill-house-entry {
    0%, 3%    { transform: scaleX(0); }
    5%        { transform: scaleX(1); }
    59%       { transform: scaleX(1); }
    63%       { transform: scaleX(0); }
    100%      { transform: scaleX(0); }
  }
  .fill-house-entry { transform-origin: 0% 50%; transform-box: fill-box; animation: fill-house-entry 16s linear infinite; }

  @keyframes fill-main {
    0%, 5%    { transform: scaleX(0); }
    10%       { transform: scaleX(1); }
    60%       { transform: scaleX(1); }
    65%       { transform: scaleX(0); }
    100%      { transform: scaleX(0); }
  }
  .fill-main { transform-origin: 0% 50%; transform-box: fill-box; animation: fill-main 16s linear infinite; }

  /* Branches fill from top (where they connect to main) downward */
  @keyframes fill-branch-1 {
    0%, 8%    { transform: scaleY(0); }
    13%       { transform: scaleY(1); }
    61%       { transform: scaleY(1); }
    66%       { transform: scaleY(0); }
    100%      { transform: scaleY(0); }
  }
  @keyframes fill-branch-2 {
    0%, 10%   { transform: scaleY(0); }
    15%       { transform: scaleY(1); }
    62%       { transform: scaleY(1); }
    67%       { transform: scaleY(0); }
    100%      { transform: scaleY(0); }
  }
  @keyframes fill-branch-3 {
    0%, 12%   { transform: scaleY(0); }
    17%       { transform: scaleY(1); }
    63%       { transform: scaleY(1); }
    68%       { transform: scaleY(0); }
    100%      { transform: scaleY(0); }
  }
  @keyframes fill-branch-4 {
    0%, 14%   { transform: scaleY(0); }
    19%       { transform: scaleY(1); }
    64%       { transform: scaleY(1); }
    69%       { transform: scaleY(0); }
    100%      { transform: scaleY(0); }
  }
  .fill-branch-1 { transform-origin: 50% 0%; transform-box: fill-box; animation: fill-branch-1 16s linear infinite; }
  .fill-branch-2 { transform-origin: 50% 0%; transform-box: fill-box; animation: fill-branch-2 16s linear infinite; }
  .fill-branch-3 { transform-origin: 50% 0%; transform-box: fill-box; animation: fill-branch-3 16s linear infinite; }
  .fill-branch-4 { transform-origin: 50% 0%; transform-box: fill-box; animation: fill-branch-4 16s linear infinite; }

  /* ===== FIXTURE WATER LEVELS ===== */
  /* Sinks: water rises in basin */
  @keyframes fixture-fill-sink {
    0%, 14%   { transform: scaleY(0); }
    20%       { transform: scaleY(1); }
    61%       { transform: scaleY(1); }
    67%       { transform: scaleY(0); }
    100%      { transform: scaleY(0); }
  }
  .fixture-water-sink { transform-origin: 50% 100%; transform-box: fill-box; animation: fixture-fill-sink 16s ease-out infinite; }

  /* Water heater tank fills bottom-up */
  @keyframes heater-fill {
    0%, 12%   { transform: scaleY(0); }
    22%       { transform: scaleY(1); }
    34%       { transform: scaleY(1); }                 /* full until leak begins */
    50%       { transform: scaleY(0.4); }               /* drops as it gushes out */
    62%       { transform: scaleY(0.15); }
    100%      { transform: scaleY(0.15); }
  }
  .heater-water { transform-origin: 50% 100%; transform-box: fill-box; animation: heater-fill 16s ease-out infinite; }

  /* Washer drum fills */
  @keyframes washer-fill {
    0%, 16%   { transform: scale(0); }
    22%       { transform: scale(1); }
    62%       { transform: scale(1); }
    68%       { transform: scale(0); }
    100%      { transform: scale(0); }
  }
  .washer-water { transform-origin: center; transform-box: fill-box; animation: washer-fill 16s ease-out infinite; }

  /* ===== DEVICE LED COLOR ===== */
  @keyframes statusColor {
    0%, 33%   { fill: #4ADE80; }
    35%, 47%  { fill: #4ADE80; }   /* normal during initial leak */
    50%, 54%  { fill: #C9A84C; }   /* amber: detection phase */
    57%, 91%  { fill: #F97316; }   /* red: shutoff active */
    94%, 100% { fill: #4ADE80; }   /* reset */
  }
  @keyframes devicePulse {
    0%, 100% { r: 18; }
    50%      { r: 20; }
  }
  .status-led-anim { animation: statusColor 16s infinite, devicePulse 2.5s ease-in-out infinite; }

  /* ===== DETECTION RINGS — pulsing amber during detection phase ===== */
  @keyframes ringExpand {
    0%, 47% { r: 22; opacity: 0; stroke-width: 2.5; }
    50%     { r: 22; opacity: 1; stroke-width: 2.5; }
    56%     { r: 65; opacity: 0; stroke-width: 0.5; }
    57%, 100% { opacity: 0; }
  }
  .detection-ring {
    fill: none;
    stroke: #C9A84C;
    animation: ringExpand 16s infinite;
  }
  .ring-2 { animation-delay: -15.7s; }
  .ring-3 { animation-delay: -15.4s; }

  /* ===== SHUTOFF ALERT RING ===== */
  @keyframes alertRing {
    0%, 55% { r: 22; opacity: 0; stroke-width: 3; }
    57%     { r: 22; opacity: 1; }
    63%     { r: 80; opacity: 0; stroke-width: 0.5; }
    64%, 100% { opacity: 0; }
  }
  .alert-ring {
    fill: none;
    stroke: #F97316;
    animation: alertRing 16s infinite;
  }

  /* ===== VALVE CLOSING ===== */
  @keyframes valveX {
    0%, 54%   { opacity: 0; stroke-dashoffset: 60; }
    58%       { opacity: 1; stroke-dashoffset: 0; }
    91%       { opacity: 1; stroke-dashoffset: 0; }
    94%, 100% { opacity: 0; }
  }
  .valve-x {
    stroke-dasharray: 60;
    animation: valveX 16s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
  }

  /* ===== CAMERA ZOOM on shutoff moment ===== */
  @keyframes cameraZoom {
    0%, 50%   { transform: scale(1); }
    58%       { transform: scale(1.05); }
    72%       { transform: scale(1.05); }
    80%       { transform: scale(1); }
    100%      { transform: scale(1); }
  }
  .scene {
    animation: cameraZoom 16s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    transform-origin: 400px 400px;
    transform-box: view-box;
  }

  /* ===== CRACK on water heater ===== */
  @keyframes crackAppear {
    0%, 28%   { opacity: 0; }
    31%       { opacity: 1; }
    91%       { opacity: 1; }
    95%, 100% { opacity: 0; }
  }
  .heater-crack { animation: crackAppear 16s infinite; }

  /* ===== SMALL INITIAL DRIPS (before the big leak) ===== */
  @keyframes initial-drip {
    0%, 28%   { opacity: 0; transform: translate(0, 0) scale(0); }
    31%       { opacity: 1; transform: translate(0, 0) scale(1); }
    36%       { opacity: 1; transform: translate(2px, 35px) scale(1); }
    38%       { opacity: 1; transform: translate(2px, 45px) scale(1.4, 0.4); }
    40%, 100% { opacity: 0; transform: translate(2px, 45px) scale(0); }
  }
  .initial-drip { animation: initial-drip 16s infinite; transform-origin: center; transform-box: fill-box; }
  .initial-drip-2 { animation-delay: -15.84s; }
  .initial-drip-3 { animation-delay: -15.68s; }

  /* ===== BIG LEAK STREAMS — arcing water gushing out ===== */
  @keyframes leakStreamShow {
    0%, 32%   { opacity: 0; }
    35%       { opacity: 0.5; }
    38%       { opacity: 1; }
    56%       { opacity: 1; }                 /* peak during 5.5–8.5s */
    60%       { opacity: 0.5; }               /* fade as shutoff lands */
    63%, 100% { opacity: 0; }
  }
  .leak-stream {
    stroke-dasharray: 18 6;
    animation: flow-fast 0.7s linear infinite, leakStreamShow 16s ease-in-out infinite;
  }

  /* ===== PUDDLE on floor grows ===== */
  @keyframes puddleGrow {
    0%, 33%   { opacity: 0; transform: scale(0); }
    37%       { opacity: 0.4; transform: scale(0.15); }
    50%       { opacity: 0.7; transform: scaleX(0.7) scaleY(0.8); }
    60%       { opacity: 0.8; transform: scaleX(1) scaleY(1); }
    72%       { opacity: 0.75; transform: scaleX(1.05) scaleY(1); }   /* small expansion after */
    91%       { opacity: 0.5; transform: scaleX(1.05) scaleY(1); }
    96%, 100% { opacity: 0; transform: scaleX(1.05) scaleY(1); }
  }
  .puddle {
    animation: puddleGrow 16s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    transform-origin: center;
    transform-box: fill-box;
  }

  /* ===== SPLASH PARTICLES around puddle base ===== */
  @keyframes splash {
    0%, 35%   { opacity: 0; transform: translate(0, 0) scale(0); }
    37%       { opacity: 1; transform: translate(0, 0) scale(1); }
    42%       { opacity: 0; transform: translate(var(--sx, -15px), var(--sy, -20px)) scale(0.4); }
    100%      { opacity: 0; }
  }
  .splash-particle {
    fill: #38BDF8;
    animation: splash 16s linear infinite;
    transform-origin: center;
    transform-box: fill-box;
  }
  .splash-1 { --sx: -22px; --sy: -18px; animation-delay: -15.9s; }
  .splash-2 { --sx: 22px;  --sy: -22px; animation-delay: -15.7s; }
  .splash-3 { --sx: -8px;  --sy: -28px; animation-delay: -15.5s; }
  .splash-4 { --sx: 16px;  --sy: -16px; animation-delay: -15.3s; }
  .splash-5 { --sx: -18px; --sy: -24px; animation-delay: -15.1s; }
  .splash-6 { --sx: 24px;  --sy: -14px; animation-delay: -14.9s; }
  .splash-7 { --sx: -12px; --sy: -20px; animation-delay: -14.7s; }
  .splash-8 { --sx: 14px;  --sy: -26px; animation-delay: -14.5s; }

  /* ===== STATUS LABELS slide in from left ===== */
  @keyframes label-1 {
    0%        { opacity: 0; transform: translateX(-20px); }
    3%, 27%   { opacity: 1; transform: translateX(0); }
    30%, 100% { opacity: 0; transform: translateX(0); }
  }
  @keyframes label-2 {
    0%, 28%   { opacity: 0; transform: translateX(-20px); }
    32%, 47%  { opacity: 1; transform: translateX(0); }
    50%, 100% { opacity: 0; transform: translateX(0); }
  }
  @keyframes label-3 {
    0%, 48%   { opacity: 0; transform: translateX(-20px); }
    51%, 60%  { opacity: 1; transform: translateX(0); }
    63%, 100% { opacity: 0; transform: translateX(0); }
  }
  @keyframes label-4 {
    0%, 61%   { opacity: 0; transform: translateX(-20px); }
    64%, 69%  { opacity: 1; transform: translateX(0); }
    72%, 100% { opacity: 0; transform: translateX(0); }
  }
  @keyframes label-5 {
    0%, 70%   { opacity: 0; transform: translateX(-20px); }
    74%, 95%  { opacity: 1; transform: translateX(0); }
    98%, 100% { opacity: 0; transform: translateX(0); }
  }

  .label-1 { animation: label-1 16s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
  .label-2 { animation: label-2 16s cubic-bezier(0.16, 1, 0.3, 1) infinite; opacity: 0; }
  .label-3 { animation: label-3 16s cubic-bezier(0.16, 1, 0.3, 1) infinite; opacity: 0; }
  .label-4 { animation: label-4 16s cubic-bezier(0.16, 1, 0.3, 1) infinite; opacity: 0; }
  .label-5 { animation: label-5 16s cubic-bezier(0.16, 1, 0.3, 1) infinite; opacity: 0; }

  /* ===== Ambient drift ===== */
  @keyframes ambient-drift {
    0%   { transform: translateY(0); opacity: 0; }
    20%  { opacity: 0.25; }
    80%  { opacity: 0.25; }
    100% { transform: translateY(-300px); opacity: 0; }
  }
  .ambient-particle { fill: #38BDF8; animation: ambient-drift 8s linear infinite; }
  .ambient-p-2 { animation-delay: -1.5s; }
  .ambient-p-3 { animation-delay: -3s; }
  .ambient-p-4 { animation-delay: -4.5s; }
  .ambient-p-5 { animation-delay: -6s; }
</style>
</head>
<body>

<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">

  <rect width="1600" height="900" fill="#001A4E"/>

  <!-- Ambient drift -->
  <g opacity="0.4">
    <circle cx="220" cy="800" r="1.5" class="ambient-particle"/>
    <circle cx="480" cy="820" r="1.2" class="ambient-particle ambient-p-2"/>
    <circle cx="760" cy="810" r="1.5" class="ambient-particle ambient-p-3"/>
    <circle cx="1020" cy="800" r="1.3" class="ambient-particle ambient-p-4"/>
    <circle cx="1320" cy="810" r="1.6" class="ambient-particle ambient-p-5"/>
    <circle cx="380" cy="820" r="1.1" class="ambient-particle ambient-p-3"/>
    <circle cx="900" cy="800" r="1.4" class="ambient-particle ambient-p-5"/>
    <circle cx="1180" cy="810" r="1.2" class="ambient-particle ambient-p-2"/>
  </g>

  <!-- Title -->
  <text x="800" y="78" font-family="'SF Mono', Menlo, monospace" font-size="13" letter-spacing="3" fill="#C9A84C" text-anchor="middle">HYDROSENSE TEXAS</text>
  <text x="800" y="128" font-family="Georgia, serif" font-size="36" fill="#F8FAFC" text-anchor="middle">How a smart shutoff saves your home</text>
  <text x="800" y="162" font-size="15" fill="#9AA8BF" text-anchor="middle">From normal flow to disaster averted, in under nine seconds</text>
  <line x1="720" y1="184" x2="880" y2="184" stroke="#C9A84C" stroke-width="0.5" opacity="0.6"/>

  <!-- ========== SCENE (camera zoom wrapper) ========== -->
  <g class="scene">

    <line x1="60" y1="640" x2="1540" y2="640" stroke="#1E3A5F" stroke-width="1"/>
    <text x="80" y="660" font-family="'SF Mono', Menlo, monospace" font-size="10" letter-spacing="2" fill="#475569">GROUND</text>

    <!-- CITY MAIN -->
    <text x="160" y="290" font-family="'SF Mono', Menlo, monospace" font-size="11" letter-spacing="2.5" fill="#9AA8BF" text-anchor="middle">CITY MAIN</text>
    <line x1="60" y1="350" x2="340" y2="350" stroke="#1E3A5F" stroke-width="22" stroke-linecap="round"/>
    <line x1="60" y1="350" x2="340" y2="350" stroke="#38BDF8" stroke-width="14" stroke-linecap="round" class="water-stream-fast fill-inlet"/>

    <!-- SMART SHUTOFF DEVICE -->
    <g transform="translate(340, 290)">
      <rect x="0" y="0" width="120" height="120" rx="14" fill="#0A2156" stroke="#38BDF8" stroke-width="1"/>
      <rect x="-10" y="48" width="20" height="24" fill="#1E3A5F"/>
      <rect x="110" y="48" width="20" height="24" fill="#1E3A5F"/>

      <circle cx="60" cy="60" r="22" class="detection-ring"/>
      <circle cx="60" cy="60" r="22" class="detection-ring ring-2"/>
      <circle cx="60" cy="60" r="22" class="detection-ring ring-3"/>
      <circle cx="60" cy="60" r="22" class="alert-ring"/>

      <circle cx="60" cy="60" r="18" class="status-led-anim" fill="#4ADE80"/>

      <g transform="translate(60, 60)">
        <line x1="-22" y1="-22" x2="22" y2="22" class="valve-x" stroke="#F97316" stroke-width="3" stroke-linecap="round" fill="none"/>
      </g>

      <text x="60" y="106" font-family="'SF Mono', Menlo, monospace" font-size="8" letter-spacing="1.5" fill="#38BDF8" text-anchor="middle">SHUTOFF</text>
    </g>
    <text x="400" y="270" font-family="'SF Mono', Menlo, monospace" font-size="11" letter-spacing="2.5" fill="#C9A84C" text-anchor="middle">SMART SHUTOFF</text>

    <!-- House entry pipe -->
    <line x1="470" y1="350" x2="540" y2="350" stroke="#1E3A5F" stroke-width="20" stroke-linecap="round"/>
    <line x1="470" y1="350" x2="540" y2="350" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" class="water-stream-fast fill-house-entry"/>

    <!-- HOUSE -->
    <text x="1010" y="270" font-family="'SF Mono', Menlo, monospace" font-size="11" letter-spacing="2.5" fill="#9AA8BF" text-anchor="middle">YOUR HOME</text>
    <path d="M 540 350 L 540 640 L 1480 640 L 1480 350 L 1010 220 Z"
          fill="none" stroke="#475569" stroke-width="1.2" stroke-linejoin="round"/>
    <line x1="540" y1="500" x2="1480" y2="500" stroke="#1E3A5F" stroke-width="1" stroke-dasharray="2 4"/>

    <!-- Main pipe in house -->
    <line x1="540" y1="350" x2="1380" y2="350" stroke="#1E3A5F" stroke-width="14" stroke-linecap="round"/>
    <line x1="540" y1="350" x2="1380" y2="350" stroke="#38BDF8" stroke-width="9" stroke-linecap="round" class="water-stream fill-main"/>

    <!-- ===== Branch 1: KITCHEN ===== -->
    <line x1="720" y1="350" x2="720" y2="560" stroke="#1E3A5F" stroke-width="10" stroke-linecap="round"/>
    <line x1="720" y1="350" x2="720" y2="560" stroke="#38BDF8" stroke-width="7" stroke-linecap="round" class="water-stream fill-branch-1"/>
    <g transform="translate(680, 560)">
      <rect x="0" y="0" width="80" height="44" rx="3" fill="#0A2156" stroke="#475569" stroke-width="1"/>
      <!-- water in basin -->
      <ellipse cx="40" cy="22" rx="26" ry="10" fill="#38BDF8" opacity="0.7" class="fixture-water-sink"/>
      <ellipse cx="40" cy="22" rx="26" ry="10" fill="none" stroke="#475569" stroke-width="0.7"/>
      <text x="40" y="62" font-family="'SF Mono', Menlo, monospace" font-size="9" letter-spacing="1.5" fill="#9AA8BF" text-anchor="middle">KITCHEN</text>
    </g>

    <!-- ===== Branch 2: WATER HEATER (leak point) ===== -->
    <line x1="960" y1="350" x2="960" y2="480" stroke="#1E3A5F" stroke-width="10" stroke-linecap="round"/>
    <line x1="960" y1="350" x2="960" y2="480" stroke="#38BDF8" stroke-width="7" stroke-linecap="round" class="water-stream fill-branch-2"/>
    <g transform="translate(925, 480)">
      <!-- tank casing -->
      <rect x="0" y="0" width="70" height="100" rx="6" fill="#0A2156" stroke="#475569" stroke-width="1"/>
      <!-- water inside tank, fills bottom up, drops during leak -->
      <rect x="3" y="3" width="64" height="94" rx="4" fill="#38BDF8" opacity="0.6" class="heater-water"/>
      <!-- tank detail strokes (above the water visual) -->
      <circle cx="35" cy="22" r="8" fill="none" stroke="#475569" stroke-width="0.7"/>
      <line x1="12" y1="48" x2="58" y2="48" stroke="#475569" stroke-width="0.5"/>
      <line x1="12" y1="64" x2="58" y2="64" stroke="#475569" stroke-width="0.5"/>
      <line x1="12" y1="80" x2="58" y2="80" stroke="#475569" stroke-width="0.5"/>
      <!-- the CRACK -->
      <g class="heater-crack">
        <path d="M 68 60 L 70 65 L 67 70 L 70 76 L 68 80" stroke="#F97316" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="35" y="120" font-family="'SF Mono', Menlo, monospace" font-size="9" letter-spacing="1.5" fill="#9AA8BF" text-anchor="middle">HEATER</text>
    </g>

    <!-- Small initial drips around crack — appear right before the big leak -->
    <circle cx="998" cy="555" r="3.5" fill="#38BDF8" class="initial-drip"/>
    <circle cx="1000" cy="565" r="3" fill="#38BDF8" class="initial-drip initial-drip-2"/>
    <circle cx="999" cy="575" r="3.5" fill="#38BDF8" class="initial-drip initial-drip-3"/>

    <!-- ===== BIG LEAK STREAMS — gushing water from heater crack ===== -->
    <g>
      <!-- Stream 1: arcs forward and down -->
      <path d="M 998 545 Q 1015 580, 1030 640" stroke="#38BDF8" stroke-width="6.5" fill="none" stroke-linecap="round" class="leak-stream"/>
      <!-- Stream 2: arcs slightly further -->
      <path d="M 998 555 Q 1025 595, 1055 640" stroke="#38BDF8" stroke-width="6" fill="none" stroke-linecap="round" class="leak-stream" style="animation-delay: -15.93s"/>
      <!-- Stream 3: tighter arc, mostly down -->
      <path d="M 1000 565 Q 1010 600, 1015 640" stroke="#38BDF8" stroke-width="5.5" fill="none" stroke-linecap="round" class="leak-stream" style="animation-delay: -15.87s"/>
      <!-- Stream 4: wide spray outward -->
      <path d="M 998 555 Q 1040 590, 1085 640" stroke="#38BDF8" stroke-width="5" fill="none" stroke-linecap="round" class="leak-stream" style="animation-delay: -15.81s"/>
    </g>

    <!-- ===== PUDDLE forming on floor ===== -->
    <ellipse cx="1050" cy="640" rx="80" ry="8" fill="#38BDF8" class="puddle"/>
    <ellipse cx="1050" cy="640" rx="50" ry="5" fill="#7DD3FC" class="puddle" style="animation-delay: -15.95s"/>

    <!-- ===== SPLASH PARTICLES around puddle ===== -->
